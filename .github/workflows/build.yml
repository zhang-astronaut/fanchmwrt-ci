name: Auto Build FanchmWrt

on:
  workflow_dispatch:   # 手动触发（强制重建）
  push:
    branches: [main]   # 配置变更推送后立即编译验证（bot 提交带 [skip ci] 不会循环触发）
  schedule:
    - cron: '17 */6 * * *'   # 每 6 小时检查一次上游更新

permissions:
  contents: write

jobs:
  check:
    name: Check upstream updates
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.c.outputs.build }}
      sha: ${{ steps.c.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: c
        name: Compare upstream HEAD with last built sha
        run: |
          set -e
          BRANCH=$(curl -sf https://api.github.com/repos/fanchmwrt/fanchmwrt | jq -r .default_branch)
          SHA=$(curl -sf "https://api.github.com/repos/fanchmwrt/fanchmwrt/commits/$BRANCH" | jq -r .sha)
          echo "upstream $BRANCH HEAD: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          OLD=$(cat upstream_sha 2>/dev/null || true)
          echo "last built sha: ${OLD:-<none>}"
          # 只有定时任务才按 sha 比对跳过；手动触发和 push（配置变更）一律编译
          if [ "$OLD" = "$SHA" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "no upstream update, skip build"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build firmware images
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SHA: ${{ needs.check.outputs.sha }}
    steps:
      # 必须在 checkout 之前：该动作会清空 $GITHUB_WORKSPACE 并挂载 LVM 卷
      - name: Maximize build space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          remove-android: 'true'
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get clean
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync unzip zlib1g-dev file wget swig \
            qemu-utils jq curl

      - name: Clone upstream at recorded sha
        run: |
          git clone --depth 1 https://github.com/fanchmwrt/fanchmwrt.git openwrt
          cd openwrt
          git log --oneline -1

      - name: Add passwall2 / UA3F feeds
        run: |
          cd openwrt
          # passwall2 + 其依赖包 feed（上游 fanchmwrt 不含，需手动添加）
          cat >> feeds.conf.default <<'EOF'
          src-git passwall_packages https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git;main
          src-git passwall2 https://github.com/Openwrt-Passwall/openwrt-passwall2.git;main
          EOF
          # UA3F 官方源码直接作为 package（含 LuCI 界面，非标准 feed 布局）
          git clone --depth 1 https://github.com/SunBK201/UA3F.git package/UA3F
          # Build/Prepare 直接调 po2lmo，显式依赖 luci-base/host（该 host 工具的来源）
          sed -i 's/^PKG_BUILD_DEPENDS:=golang\/host$/PKG_BUILD_DEPENDS:=golang\/host luci-base\/host/' \
            package/UA3F/openwrt/Makefile
          # 关键补丁：UA3F 开机竞态修复
          # 根因：开机时 WAN 默认路由未就绪 → BPF TC "no eligible interfaces" → 连崩
          # procd 默认只重试 5 次即放弃 → UA3F 永久躺平（校园网看到裸 UA → 封禁）
          # 修复：respawn 第三参数 0 = 无限重试，等路由就绪后自动恢复
          sed -i 's/^    procd_set_param respawn$/    procd_set_param respawn 3600 5 0/' \
            package/UA3F/openwrt/files/ua3f.init
          grep -n 'procd_set_param respawn' package/UA3F/openwrt/files/ua3f.init

      - name: Apply fwx TPROXY stats patch + custom config
        run: |
          cd openwrt
          PATCH="$GITHUB_WORKSPACE/fwx-tproxy-stat.patch"
          if [ -f "$PATCH" ]; then
            git apply --check "$PATCH" 2>/dev/null && \
              git apply "$PATCH" || \
              patch -p1 --forward < "$PATCH" || \
              echo "WARN: patch no longer applies cleanly (upstream changed fwx), continuing without it"
          fi
          cp "$GITHUB_WORKSPACE/fanchmwrt.config" .config

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: defconfig + TEMP diagnostics
        run: |
          cd openwrt
          make defconfig
          echo "===== A) 原始 kconfig 文本（带行号） ====="
          F=tmp/.config-package.in
          wc -l "$F"
          for s in PACKAGE_ua3f PACKAGE_ttyd PACKAGE_docker PACKAGE_xray-core; do
            echo "########## $s ##########"
            awk -v pat="(menu)?config $s$" '$0 ~ pat {f=NR} {b[NR]=$0} END {if (f) {for (i=f-8;i<=f+14;i++) if (i>0 && i<=NR) printf "%d|%s\n", i, b[i]} else print "NOT FOUND"}' "$F"
          done
          echo "===== B) 这些符号在 kconfig 里被谁引用过 ====="
          grep -n "PACKAGE_ttyd\|PACKAGE_docker\b" "$F" | head -20
          echo "===== C) 手动跑 kconfig defconfig，看有无 warning ====="
          cp .config tmp/.config
          ./scripts/config/conf --defconfig=tmp/.config -w tmp/.config Config.in 2>&1 | tail -30
          echo "===== D) 试验：追加 =y 后用 olddefconfig 能否保住 ====="
          for s in luci-app-passwall2 xray-core sing-box geoview tcping v2ray-geoip v2ray-geosite docker dockerd luci-app-dockerman luci-app-fwx-app-center ttyd btrfs-progs; do
            sed -i "/^# CONFIG_PACKAGE_${s} is not set$/d" .config
            echo "CONFIG_PACKAGE_${s}=y" >> .config
          done
          ./scripts/config/conf --olddefconfig Config.in > /dev/null 2>&1 || true
          echo "--- olddefconfig 之后的状态 ---"
          for s in luci-app-passwall2 xray-core sing-box docker dockerd ttyd ua3f; do
            if grep -q "^CONFIG_PACKAGE_${s}=y" .config; then echo "OK   ${s}=y"
            elif grep -q "^# CONFIG_PACKAGE_${s} is not set" .config; then echo "OFF  ${s}"
            else echo "GONE ${s}"; fi
          done
          echo "===== 诊断结束，主动失败以节省时间 ====="
          exit 1
          echo "===== 旧版 python 依赖求值（保留） ====="
          python3 - <<'PY'
          import re
          cfg = {}
          for l in open('.config', encoding='utf-8', errors='replace'):
              s = l.strip()
              m = re.match(r'^# CONFIG_(PACKAGE_[^ ]+) is not set$', s)
              if m:
                  cfg[m.group(1)] = 'n'
                  continue
              m = re.match(r'^CONFIG_(PACKAGE_[^=]+)=(.*)$', s)
              if m:
                  cfg[m.group(1)] = m.group(2).strip('"')
          txt = open('tmp/.config-package.in', encoding='utf-8', errors='replace').read()
          blocks = {}
          cur = None
          for line in txt.splitlines():
              m = re.match(r'^[ \t]*(?:menu)?config (PACKAGE_\S+)\s*$', line)
              if m:
                  cur = m.group(1)
                  blocks[cur] = []
                  continue
              if cur is not None:
                  if re.match(r'^[ \t]*(?:menu)?config ', line) or line.startswith('menu '):
                      cur = None
                  else:
                      blocks[cur].append(line)
          print('kconfig 里的 PACKAGE_ 符号总数:', len(blocks))
          targets = ['PACKAGE_luci-app-passwall2','PACKAGE_xray-core','PACKAGE_sing-box','PACKAGE_geoview',
                     'PACKAGE_tcping','PACKAGE_docker','PACKAGE_dockerd','PACKAGE_luci-app-dockerman',
                     'PACKAGE_luci-app-fwx-app-center','PACKAGE_ttyd','PACKAGE_btrfs-progs','PACKAGE_ua3f']
          for t in targets:
              blk = blocks.get(t)
              print('=' * 70)
              print('###', t, '存在' if blk is not None else '**不在 kconfig**', '当前值=', cfg.get(t, '<缺>'))
              if not blk:
                  continue
              for line in blk:
                  ls = line.strip()
                  if ls.startswith('depends on') or ls.startswith('select'):
                      print('   ', ls)
                      if 'depends on' in ls:
                          for ref in re.findall(r'PACKAGE_[A-Za-z0-9_.+\-]+', ls):
                              print('        ->', ref, '=', cfg.get(ref, '<缺>'))
          print('=' * 70)
          print('### 全局：所有含 "!= y" 冲突约束且被 =y 包触发的符号')
          for sym, blk in blocks.items():
              for line in blk:
                  ls = line.strip()
                  if ls.startswith('depends on') and '!= y' in ls:
                      for ref in re.findall(r'PACKAGE_[A-Za-z0-9_.+\-]+', ls):
                          if cfg.get(ref) == 'y':
                              print(f'   {sym}  被  {ls}  限制（{ref}=y）')
          PY
          echo "===== 诊断结束，主动失败以节省时间 ====="
          exit 1

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Convert to VHD / VHDX
        run: |
          cd openwrt/bin/targets/x86/64
          mkdir -p images
          for img in *-combined-*.img.gz; do
            [ -e "$img" ] || continue
            base=$(basename "$img" .img.gz)
            gunzip -c "$img" > "images/$base.img"
            qemu-img convert -O vhdx "images/$base.img" "images/$base.vhdx"
            qemu-img convert -O vpc "images/$base.img" "images/$base.vhd"
            rm -f "images/$base.img"
          done
          cp *.img.gz images/ 2>/dev/null || true
          cp *.manifest images/ 2>/dev/null || true
          cp sha256sums images/ 2>/dev/null || true
          cd images && sha256sum * > sha256sums.txt

      - name: Record built upstream sha
        run: |
          echo "$SHA" > upstream_sha
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upstream_sha
          git commit -m "chore: built upstream $SHA [skip ci]" || true
          git push || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-images-${{ github.run_number }}
          path: openwrt/bin/targets/x86/64/images/
          retention-days: 14

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: r${{ github.run_number }}
          name: FanchmWrt build r${{ github.run_number }}
          body: |
            基于上游 fanchmwrt/fanchmwrt @ `${{ needs.check.outputs.sha }}` 自动编译。
            - 已应用 fwx TPROXY 流量统计补丁
            - 内置 UA3F（含 LuCI 界面 + 开机竞态无限重试修复）
            - 内置 PassWall2 + LuCI 界面 + xray-core / sing-box 双核心
            - 配置见仓库 fanchmwrt.config（4G 分区 / Docker / UA3F 全套 kmod / 应用中心）
            - ⚠️ UA3F 与 PassWall2 共存注意：PassWall2 的 TCP 代理方式请保持默认 redirect，
              勿改 tproxy（会与 UA3F 的 TPROXY 在 mangle PREROUTING 抢包）
          files: openwrt/bin/targets/x86/64/images/*
